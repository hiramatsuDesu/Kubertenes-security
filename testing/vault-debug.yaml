apiVersion: v1
kind: Pod

metadata:
  name: vault-debug
  namespace: security-lab

spec:

  containers:

  - name: vault

    image: hashicorp/vault:1.19

    command:
      - sleep

    args:
      - "3600"

    volumeMounts:

    - name: vault-config
      mountPath: /vault/config

    - name: vault-storage
      mountPath: /vault/data

  volumes:

  - name: vault-config
    configMap:
      name: vault-config

  - name: vault-storage
    persistentVolumeClaim:
      claimName: vault-pvc