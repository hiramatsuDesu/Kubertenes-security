apiVersion: v1
kind: ConfigMap
metadata:
  name: vault-agent-config
  namespace: security-lab

data:
  vault-agent.hcl: |
    vault {
      address = "http://vault:8200"
    }

    exit_after_auth = false

    auto_auth {
      method "kubernetes" {
        mount_path = "auth/kubernetes"

        config = {
          role = "admin"
        }
      }

      sink "file" {
        config = {
          path = "/vault/secrets/token"
        }
      }
    }

    template {
      source      = "/etc/vault/template/admin.ctmpl"
      destination = "/vault/secrets/admin"
    }