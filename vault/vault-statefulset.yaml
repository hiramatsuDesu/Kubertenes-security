apiVersion: apps/v1
kind: StatefulSet

metadata:
  name: vault
  namespace: security-lab

spec:

  serviceName: vault

  replicas: 1

  selector:
    matchLabels:
      app: vault

  template:

    metadata:
      labels:
        app: vault

    spec:

      serviceAccountName: vault

      containers:

      - name: vault

        image: hashicorp/vault:1.19

        command:
          - vault

        args:
          - server
          - -config=/vault/config/vault.hcl

        ports:
        - containerPort: 8200
          name: http

        securityContext:
          capabilities:
            add:
              - IPC_LOCK

        volumeMounts:

        - name: vault-storage
          mountPath: /vault/data

        - name: vault-config
          mountPath: /vault/config

      volumes:

      - name: vault-config
        configMap:
          name: vault-config

      - name: vault-storage
        persistentVolumeClaim:
          claimName: vault-pvc